name: PR Agent

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  pr_agent:
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/review'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Run PR Agent review
        uses: the-pr-agent/pr-agent@main
        env:
          # Public GitHub repos do not incur GitHub Actions charges, and
          # the PR-Agent project itself is open source. Model API usage still
          # incurs the provider's standard billing, so this key should be set
          # only if you are comfortable with the provider's usage fees.
          OPENROUTER__KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER__API_BASE: https://openrouter.ai/api/v1
          MODEL: openrouter/deepseek/deepseek-v4.1-flash
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
